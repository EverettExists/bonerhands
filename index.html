<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VR Hands Sandbox</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:rgba(14,20,28,.82);--fg:#e6f1ff;--mut:#8fa6bf;--acc:#4cc9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block}
#ui{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--fg);padding:14px 18px;border-radius:14px;max-width:min(92vw,460px);text-align:center;font-size:14px;line-height:1.45}
#ui p{margin:0 0 10px;color:var(--mut)}
button{background:var(--acc);color:#04202c;border:0;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;margin:0 4px}
button.s{background:#223244;color:var(--fg)}
</style></head><body>
<div id="ui"><p>Controllers: trigger curls the index finger, grip curls the other three, thumb buttons curl the thumb. Hand tracking works too. Knock the balls around.</p>
<button id="vr">Checking VR…</button><button id="rs" class="s">Reset balls</button><div id="err" style="margin-top:8px;font-size:12px;color:#ffb4a8"></div></div>

 gl_FragColor=vec4(vec3(.35,.8,1.)*m+vec3(.03,.06,.09),(m*.9+.55)*f);}`}));
scene.add(floor);

  let p=base;const segs=[];
  f.L.forEach((L,i)=>{const s=new THREE.Bone();if(i)s.position.z=-f.L[i-1];p.add(s);segs.push(s);bones.push(s);p=s;});
  const tip=new THREE.Object3D();tip.position.z=-f.L[2];p.add(tip);

function stepFingers(h,dt){
 h.fingers.forEach((F,i)=>{for(let j=0;j<3;j++){
  const tgt=(.1+.9*h.curl[i])*F.f.max[j],acc=220*(tgt-F.a[j])-20*F.v[j];
  F.v[j]+=acc*dt;F.a[j]=clamp(F.a[j]+F.v[j]*dt,-.15,F.f.max[j]+.1);F.segs[j].rotation.x=-F.a[j];}});
 h.root.updateMatrixWorld(true);
 h.fingers.forEach(F=>{for(let k=0;k<8;k++){
  if(Math.min(...F.pts.map(o=>o.getWorldPosition(tmp).y))>F.f.r*.9)break;
  for(let j=0;j<3;j++){F.a[j]=Math.max(F.a[j]-.06,-.15);F.v[j]=0;F.segs[j].rotation.x=-F.a[j];}
  h.root.updateMatrixWorld(true);}});
}

const TIPS=['thumb-tip','index-finger-tip','middle-finger-tip','ring-finger-tip','pinky-finger-tip'];

  if(!o.side||o.side==='none')return;
  const h=hands[o.side==='left'?0:1],J=o.hd.joints;
  if(o.tracked&&J&&J.wrist&&J.wrist.visible){
   J.wrist.matrix.decompose(h.root.position,h.root.quaternion,tmpS);
   h.model.rotation.set(0,0,0);h.root.visible=true;
   const w=J.wrist.position;
   TIPS.forEach((n,i)=>{const t=J[n];if(!t)return;const d=t.position.distanceTo(w);h.curl[i]=clamp((RNG[i][0]-d)/(RNG[i][0]-RNG[i][1]),0,1);});
  }else if(!o.tracked){
   o.g.matrix.decompose(h.root.position,h.root.quaternion,tmpS);
   h.model.rotation.set(0.25,0,o.side==='left'?Math.PI/2:-Math.PI/2);h.root.visible=true;
   const b=o.gp?o.gp.buttons:[],val=k=>b[k]?b[k].value:0;
   const t=val(0),g=val(1),th=Math.max(val(3),val(4),val(5));

  }});
}

function stepBalls(dt,cols){balls.forEach(b=>{
 const v=b.userData.v;v.y-=9.8*dt;b.position.addScaledVector(v,dt);
 if(b.position.y<R){b.position.y=R;if(v.y<0)v.y*=-.72;v.x*=.99;v.z*=.99;}
 ['x','z'].forEach(a=>{if(Math.abs(b.position[a])>4){b.position[a]=Math.sign(b.position[a])*4;v[a]*=-.7;}});
 cols.forEach(c=>{const d=tmp.subVectors(b.position,c.p),L=d.length(),mr=R+c.r;
  if(L<mr&&L>1e-5){d.divideScalar(L);b.position.addScaledVector(d,mr-L);
   const rel=(v.x-c.v.x)*d.x+(v.y-c.v.y)*d.y+(v.z-c.v.z)*d.z;if(rel<0)v.addScaledVector(d,-rel*1.6);}});
});}
function collect(dt){const out=[];
 hands.forEach(h=>{if(!h.root.visible)return;
  const add=(o,r)=>{const p=o.getWorldPosition(new V3()),pr=o.userData.prev||p.clone();
   out.push({p,r,v:p.clone().sub(pr).divideScalar(dt)});o.userData.prev=p.clone();};

  try{s=await navigator.xr.requestSession('immersive-vr',o);break;}catch(e){last=e;}}
 if(!s){err.textContent='Could not start VR: '+(last?last.name+' - '+last.message:'unknown error')+(top!==self?' (this page is inside a frame that blocks VR, open it directly or host the file over HTTPS)':'')+' [secure='+isSecureContext+', framed='+(top!==self)+', '+location.protocol+']';return;}
 try{await renderer.xr.setSession(s);ui.style.display='none';s.addEventListener('end',()=>{ui.style.display='';});}
 catch(e){err.textContent='Could not start VR: '+e.name+' - '+e.message;}
}
if(!navigator.xr){btn.textContent='WebXR not available';err.textContent='Open this page in a VR headset browser over HTTPS.';}
else navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
 if(ok){btn.textContent='Enter VR';btn.onclick=start;}
 else{btn.textContent='VR not supported';err.textContent='This browser or device cannot start an immersive VR session.';}
}).catch(e=>{btn.textContent='VR check failed';err.textContent=String(e);});
